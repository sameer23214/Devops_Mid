<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Submission Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 2.2rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #message {
            margin-top: 12px;
            font-weight: 500;
            text-align: center;
        }

        .error { color: var(--error-color); }
        .success { color: var(--success-color); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-main);
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Assignment Portal</h1>
            <p>CSC418 DevOps Lab Midterm Submission System</p>
        </header>

        <!-- Submission Form Card -->
        <div class="card">
            <h2>Submit Assignment</h2>
            <form id="submissionForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. Sameer Ahmad">
                </div>
                <div class="form-group">
                    <label for="regNumber">Registration Number</label>
                    <input type="text" id="regNumber" required placeholder="e.g. FA23-BSE-011">
                </div>
                <div class="form-group">
                    <label for="title">Assignment Title</label>
                    <input type="text" id="title" required placeholder="e.g. DevOps Lab Midterm">
                </div>
                <div class="form-group">
                    <label for="url">Submission URL (GitHub Repo)</label>
                    <input type="url" id="url" required placeholder="https://github.com/username/repo">
                </div>
                <button type="submit">Submit Assignment</button>
                <div id="message"></div>
            </form>
        </div>

        <!-- Submissions List Card -->
        <div class="card">
            <h2>Saved Submissions</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Reg #</th>
                            <th>Title</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTableBody">
                        <!-- Dynamically populated rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadSubmissions() {
            try {
                const response = await fetch('/api/submissions');
                if (response.ok) {
                    const data = await response.json();
                    const tbody = document.getElementById('submissionsTableBody');
                    tbody.innerHTML = '';
                    data.forEach(sub => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${sub.name}</td>
                            <td>${sub.regNumber}</td>
                            <td>${sub.title}</td>
                            <td><a href="${sub.url}" target="_blank">View Repo</a></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error('Could not load submissions', err);
            }
        }

        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            
            const payload = {
                name: document.getElementById('name').value,
                regNumber: document.getElementById('regNumber').value,
                title: document.getElementById('title').value,
                url: document.getElementById('url').value
            };

            try {
                const res = await fetch('/api/submissions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    msg.textContent = 'Assignment submitted successfully!';
                    msg.className = 'success';
                    document.getElementById('submissionForm').reset();
                    loadSubmissions();
                } else {
                    const errData = await res.json();
                    msg.textContent = errData.message || 'Validation failed. Check inputs.';
                    msg.className = 'error';
                }
            } catch (err) {
                msg.textContent = 'Server connection error.';
                msg.className = 'error';
            }
        });

        loadSubmissions();
    </script>
</body>
</html>
